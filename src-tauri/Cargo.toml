[package]
name = "ludotheque"
version = "0.1.0"
description = "Unified PC game library and launcher"
edition = "2021"
rust-version = "1.85"

[lib]
name = "ludotheque_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
uuid = { version = "1.29.0", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
keyring-core = "1.0.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.4"
lnk = "0.6.4"
md-5 = "0.11.0"
ureq = { version = "3.5.1", features = ["json"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta-typescript = "=0.0.13"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_XboxController", "Win32_System_SystemInformation", "Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.27.0"
